apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-actions
  namespace: wordpress
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: github-actions-wordpress-deploy
  namespace: wordpress
rules:
  - apiGroups: [""]
    resources:
      - configmaps
      - persistentvolumeclaims
      - secrets
      - services
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources:
      - pods
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-actions-wordpress-deploy
  namespace: wordpress
subjects:
  - kind: ServiceAccount
    name: github-actions
    namespace: wordpress
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: github-actions-wordpress-deploy
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: github-actions-ingress-smoke-test
  namespace: nginx-ingress
rules:
  - apiGroups: [""]
    resources:
      - services
      - pods
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources:
      - pods/portforward
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-actions-ingress-smoke-test
  namespace: nginx-ingress
subjects:
  - kind: ServiceAccount
    name: github-actions
    namespace: wordpress
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: github-actions-ingress-smoke-test
