wordpress:
  image:
    repository: wordpress
    tag: 6-apache
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    type: ClusterIP
    port: 80
  persistence:
    enabled: true
    accessModes:
      - ReadWriteOnce
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

mariadb:
  image:
    repository: mariadb
    tag: "11.4"
    pullPolicy: IfNotPresent
  auth:
    database: wordpress
    username: wordpress
    rootPassword: ""
    password: ""
    existingSecret: ""
  service:
    port: 3306
  persistence:
    enabled: true
    accessModes:
      - ReadWriteOnce
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

ingress:
  enabled: true
  className: nginx
  host: wordpress.colasloth.com
  path: /
  pathType: Prefix
