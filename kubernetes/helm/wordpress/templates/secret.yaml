apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wordpress.fullname" . }}-database
  labels:
    {{- include "wordpress.labels" . | nindent 4 }}
type: Opaque
stringData:
  mariadb-root-password: {{ required "mariadb.auth.rootPassword must be set" .Values.mariadb.auth.rootPassword | quote }}
  mariadb-password: {{ required "mariadb.auth.password must be set" .Values.mariadb.auth.password | quote }}
