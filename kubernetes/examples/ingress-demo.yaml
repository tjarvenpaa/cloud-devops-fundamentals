apiVersion: v1
kind: Namespace
metadata:
  name: colasloth
---
apiVersion: v1
kind: Namespace
metadata:
  name: fbi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  namespace: colasloth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: echo
  template:
    metadata:
      labels:
        app: echo
    spec:
      containers:
        - name: echo
          image: hashicorp/http-echo:1.0
          args:
            - "-text=Hello from colasloth namespace"
          ports:
            - name: http
              containerPort: 5678
              protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: echo
  namespace: colasloth
spec:
  type: ClusterIP
  selector:
    app: echo
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 5678
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  namespace: fbi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: echo
  template:
    metadata:
      labels:
        app: echo
    spec:
      containers:
        - name: echo
          image: hashicorp/http-echo:1.0
          args:
            - "-text=Hello from fbi namespace"
          ports:
            - name: http
              containerPort: 5678
              protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: echo
  namespace: fbi
spec:
  type: ClusterIP
  selector:
    app: echo
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 5678
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: colasloth
spec:
  ingressClassName: nginx
  rules:
    - host: colasloth.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: echo
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: fbi
spec:
  ingressClassName: nginx
  rules:
    - host: fbi.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: echo
                port:
                  number: 80
